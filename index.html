<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outer Wilds Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <main class="container">
        <section class="music-player">
            
            <div class="song-info">
                <h1 class="song-name">Travelers</h1>
                <p class="artist-name">Andrew Prahlow</p>
            </div>

            <div class="disk"></div>

            <div class="audio-interface">
                <audio controls class="native-player">
                    <source src="travelers.mp3" type="audio/mpeg">
                    Seu navegador não suporta áudio.
                </audio>
            </div>

            <div class="controls-visual">
                <i class="fas fa-backward"></i>
                <div class="play-placeholder"></div>
                <i class="fas fa-forward"></i>
            </div>

        </section>
    </main>

</body>
</html>
